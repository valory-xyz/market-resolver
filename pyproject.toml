[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project]
name = "market-resolver"
version = "0.1.0"
description = ""
requires-python = "<3.15,>=3.10"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "open-autonomy[cli]==0.21.23",
    "hypothesis==6.21.6",
    "grpcio==1.78.0",
    "aiohttp<4.0.0,>=3.8.5",
    "asn1crypto<1.5.0,>=1.4.0",
    "open-aea-ledger-ethereum==2.2.7",
    "openai==1.93.0",
    "protobuf>=5,<6",
    "open-aea-helpers==0.21.23",
    "open-aea-test-autonomy==0.21.23",
    "ipfshttpclient==0.8.0a2",
    "open-aea-cli-ipfs==2.2.7",
    "requests==2.32.5",
    "pytest>=8.2,<10",
    "pytest-asyncio==1.3.0",
    "ecdsa>=0.15",
    "open-aea-ledger-cosmos==2.2.7",
    "certifi==2026.2.25",
    "multidict==6.7.1",
    "py-eth-sig-utils==0.4.0",
    "web3<8,>=7.0.0",
    "eth_typing==5.2.1",
    "pytz==2022.2.1",
    "typing_extensions<=4.15.0,>=3.10.0.2",
    "hexbytes==1.3.1",
    "packaging==26",
    "openapi-core==0.22.0",
    "openapi-spec-validator>=0.7.0,<0.8.0",
    "eth-utils==5.3.0",
    "setuptools>=78.0.1,<79",
    "py-multibase==1.0.3",
    "py-multicodec==0.2.1",
    # kv-store connection uses peewee for its SQLite ORM. Version range
    # tracks kv-store's own connection.yaml (==3.17.5 as of v0.7.0-rc1),
    # loosened to a compatible range so we can pick up patch bumps.
    "peewee>=3.17,<4",
]

[project.urls]
Repository = "https://github.com/valory-xyz/market-resolver"

[dependency-groups]
dev = [
    "tomte[cli, tests] @ git+https://github.com/valory-xyz/tomte.git@0819eea387c622cc53b398a2d3ea86e94a55cf82",
    "pip>=24.0",
]

[tool.uv]
default-groups = "all"
prerelease = "allow"

[tool.tomte]
# Third-party packages on disk are synced from open-autonomy + open-aea
# upstreams (auto-prepended) plus mech-interact for the mech_interact_abci
# skill, omen-protocol for the Realitio / FPMM contract wrappers and the
# omen_* resolution skills, and genai for the llm protocol + openai
# connection.
upstream_pins = [
    "valory-xyz/mech-interact@v0.32.4-rc1",
    "valory-xyz/omen-protocol@v0.1.2",
    "valory-xyz/genai@v7.2.1",
    # kv-store 0.7.0-rc1 is the first release that ships LIST/DELETE
    # performatives + pagination. Needed for market-resolver's "have I
    # asked this market?" cache (see docs/market_resolver_offchain_scope.md
    # in autonolas-marketplace).
    "valory-xyz/kv-store@0.7.0-rc1",
]
# Content-based gitleaks allowlist — preferred over `gitleaks_extra_paths`
# so the scanner still inspects skill source for genuine secrets (private
# keys, API tokens) but lets known false-positive identifiers through.
gitleaks_extra_regexes = [
    # IPFS CIDv1 hashes used by Open Autonomy package fingerprints.
    "bafybei[a-z2-7]{52}",
    # ABCI consensus payload constants are SCREAMING_SNAKE_CASE strings
    # ending in _PAYLOAD; high entropy trips gitleaks' generic-api-key rule.
    "[A-Z][A-Z0-9_]+_PAYLOAD",
    # ABCI synchronized_data attributes use the framework-mandated
    # `participant_to_<name>` namespace; high-entropy snake_case identifier.
    "participant_to_[a-z][a-z0-9_]+",
    # Service config keys for on-chain identifiers follow OA convention
    # `<name>_(contract|address|proxy|factory|tracker|oracle)`. Same shape.
    "[a-z][a-z0-9_]*_(?:contract|address|proxy|factory|tracker|oracle)",
]
tomte_dep_pin = " @ git+https://github.com/valory-xyz/tomte.git@0819eea387c622cc53b398a2d3ea86e94a55cf82"

[tool.uv.build-backend]
module-name = ["packages"]
module-root = ""
